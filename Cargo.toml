[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.2"
actix-web = "4.17.0"
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hc_helper = { git = "https://github.com/breynard0/hc_helper", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "json", "chrono"] }
tokio = { version = "1", features = ["net"] }
tract-onnx = "0.23.8"
webp = { version = "0.3.1", default-features = false }

[build-dependencies]
hex = "0.4.3"
sha2 = "0.11.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
